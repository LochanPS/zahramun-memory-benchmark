# PPO + frame stacking k=4 — cheap memory proxy
# Hypothesis: partial memory helps but not as much as full LSTM

algorithm: PPO
policy: MlpPolicy
frame_stack: 4       # stack last 4 obs into one flat obs

learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Larger network to handle stacked obs
net_arch: [512, 256]

n_envs: 4
total_timesteps: 1_000_000

log_interval: 10
eval_freq: 50_000
eval_episodes: 20
