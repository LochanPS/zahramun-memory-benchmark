# PPO baseline — feedforward MLP, no memory
# Hypothesis: collapses at HEAVY/CRITICAL drought (no memory = no recall of old cells)

algorithm: PPO
policy: MlpPolicy

# SB3 PPO hyperparams
learning_rate: 3.0e-4
n_steps: 2048        # steps per env per rollout
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01       # entropy bonus — encourages exploration
vf_coef: 0.5
max_grad_norm: 0.5

# Network
net_arch: [256, 256]

# Training
n_envs: 4
total_timesteps: 1_000_000

# Logging
log_interval: 10     # log every N rollouts
eval_freq: 50_000    # eval every N steps
eval_episodes: 20
